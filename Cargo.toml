[package]
name = "dcmfree"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reclaim disk space by destroying orphan Windows container layers via the Host Compute Service API"
license = "MIT"
repository = "https://github.com/robinduckett/dcmfree"
homepage = "https://github.com/robinduckett/dcmfree"
documentation = "https://github.com/robinduckett/dcmfree"
readme = "README.md"
keywords = ["windows", "containers", "hcs", "docker", "cleanup"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Robin Duckett <robin.duckett@gmail.com>"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
bytesize = "1.3"
humantime = "2.1"
chrono = { version = "0.4", features = ["serde"] }
native-windows-gui = "1.0"
native-windows-derive = "1.0"
# HCS storage APIs (HcsDestroyLayer etc.) are not in the official `windows`
# crate as of 0.60 — only HostCompute/HostComputeNetwork/HostComputeSystem
# are exposed. We declare the single function we need via raw FFI in
# src/hcs.rs and link to computestorage.dll directly.
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_HostComputeSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3

[[bin]]
name = "dcmfree"
path = "src/main.rs"

[lib]
name = "dcmfree"
path = "src/lib.rs"
